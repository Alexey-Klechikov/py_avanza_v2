name: Deploy to Remote Server and Update Cronjob

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Install ssh-keyscan
      run: sudo apt-get install -y openssh-client

    - name: Setup SSH and deploy
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        REMOTE_USERNAME: ${{ secrets.REMOTE_USERNAME }}
        REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H $REMOTE_HOST >> ~/.ssh/known_hosts

        # Ensure the destination directory exists on the remote server
        ssh ${REMOTE_USERNAME}@${REMOTE_HOST} \
          "mkdir -p /home/ubuntu/pyAvanza/"

        # Use rsync to copy only files under src/ directory to remote server
        rsync -avz -e "ssh -o StrictHostKeyChecking=no" \
          ./src/ ${REMOTE_USERNAME}@${REMOTE_HOST}:/home/ubuntu/pyAvanza/

        cronjobs=(
          "task_eod 0 19 * * 1-5"
          "task_backup 2 3 * * 1-5"
        )

        # Update crontab for each cronjob
        for job in "${cronjobs[@]}"; do
          task_name=$(echo "$job" | awk '{print $1}')
          cron_schedule=$(echo "$job" | awk '{$1=""; print $0}')

          # Check if task_name already exists in crontab
          if ssh ${REMOTE_USERNAME}@${REMOTE_HOST} "crontab -l | grep -q '/home/ubuntu/pyAvanza/$task_name'"; then
            # Task exists, remove old entry before adding new one
            ssh ${REMOTE_USERNAME}@${REMOTE_HOST} \
              "crontab -l | sed -e '/\/home\/ubuntu\/pyAvanza\/$task_name/d' | crontab -"
          fi

          # Add the new cron job
          echo "$cron_schedule /usr/bin/python3 /home/ubuntu/pyAvanza/$task_name.py" | ssh ${REMOTE_USERNAME}@${REMOTE_HOST} "crontab -"
        done
