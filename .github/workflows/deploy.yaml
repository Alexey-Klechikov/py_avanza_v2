name: Deploy to Remote Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install SSH client
      run: sudo apt-get install -y openssh-client

    - name: Add SSH key
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}

    - name: Install sshpass
      run: sudo apt-get install -y sshpass

    - name: Copy files via SFTP
      env:
        USERNAME: ${{ secrets.USERNAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
        HOST: ${{ secrets.HOST }}
      run: |
        sshpass -p "$PASSWORD" sftp -o StrictHostKeyChecking=no $USERNAME@$HOST <<EOF
        mkdir -p /home/ubuntu/pyAvanza
        put -r * /home/ubuntu/pyAvanza
        bye
        EOF

    - name: Run commands on remote server via SSH
      env:
        USERNAME: ${{ secrets.USERNAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
        HOST: ${{ secrets.HOST }}
      run: |
        sshpass -p "$PASSWORD" ssh -o StrictHostKeyChecking=no $USERNAME@$HOST <<EOF
        cd /home/ubuntu/pyAvanza
        # Add any other commands you need to run on the server
        EOF
