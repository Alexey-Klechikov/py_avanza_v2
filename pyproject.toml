[tool.black]
line-length = 122

[tool.flake8]
show-source = true
filename = ["*.py"]
exclude = [".git", "__pycache__", "*.pyc"]
statistics = true
max-line-length = 122
ignore = ["W503", "E203", "F401"]

[tool.isort]
atomic = true
profile = "black"
line_length = 122
skip_gitignore = true
known_first_party = ["black", "blib2to3", "blackd", "_black_version"]

[tool.pytest.ini_options]
minversion = "6.0"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pylint]
disable = "redefined-outer-name,too-few-public-methods,cell-var-from-loop,unspecified-encoding,expression-not-assigned"
